name: Roboflow Public Endpoint Probe

on:
  pull_request:
    branches: [main]
    paths:
      - tools/probe_roboflow.py
      - .github/workflows/roboflow-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - run: python tools/probe_roboflow.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roboflow-probe
          path: roboflow_probe
          if-no-files-found: warn
          retention-days: 3
          compression-level: 6
