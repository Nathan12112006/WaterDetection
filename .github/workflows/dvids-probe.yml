name: DVIDS Video Probe

on:
  pull_request:
    branches: [main]
    paths:
      - tools/probe_dvids_video.py
      - .github/workflows/dvids-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install yt-dlp
      - run: python tools/probe_dvids_video.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dvids-probe
          path: dvids_probe
          if-no-files-found: warn
          retention-days: 3
          compression-level: 0
