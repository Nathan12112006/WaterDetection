name: Industrial Water Candidate Collector

on:
  pull_request:
    branches: [main]
    paths:
      - tools/collect_industrial_water_candidates_v3.py
      - .github/workflows/industrial-water-candidate-collector.yml
  workflow_dispatch:
    inputs:
      per_class:
        description: Second-wave candidates to retain per category
        required: false
        default: "40"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out collector branch
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install collector dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ddgs requests pillow numpy opencv-python-headless

      - name: Collect second-wave candidate images
        env:
          PER_CLASS: ${{ github.event.inputs.per_class || '40' }}
        run: |
          python tools/collect_industrial_water_candidates_v3.py \
            --output collector_output_wave2 \
            --per-class "$PER_CLASS"

      - name: Show collection statistics
        if: always()
        run: |
          test -f collector_output_wave2/stats.json && cat collector_output_wave2/stats.json || true
          find collector_output_wave2/images -type f -name '*.jpg' 2>/dev/null | wc -l || true

      - name: Upload candidate pool
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: industrial-water-candidates-wave2
          path: |
            collector_output_wave2/industrial_water_candidates_wave2.zip
            collector_output_wave2/stats.json
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
