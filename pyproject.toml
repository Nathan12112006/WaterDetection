[project]
name = "waterdetection"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.139.0",
    "numpy==2.3.5",
    "opencv-python==5.0.0.93",
    "pillow==12.3.0",
    "pydantic==2.13.4",
    "python-multipart==0.0.32",
    "torch==2.13.0",
    "torchvision==0.28.0",
    "ultralytics==8.4.112",
    "uvicorn[standard]==0.51.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
